name: Publish CLI

on:
  push:
    tags:
      - "cli-v*.*.*"

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # inline @nonlocalhost/shared + @clack/prompts into a single file, so
      # the published package has zero runtime dependencies to resolve
      - name: Bundle
        working-directory: apps/cli
        run: bun run bundle

      - name: Check tag matches package.json version
        working-directory: apps/cli
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag cli-v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # publish reads dist/index.js directly; the workspace-only fields below
      # (private, devDependencies, "@nonlocalhost/shared": "workspace:*")
      # only make sense inside this monorepo and would break `npm install`
      # for anyone installing the published package
      - name: Strip workspace-only fields for publish
        working-directory: apps/cli
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            delete pkg.private;
            delete pkg.devDependencies;
            delete pkg.dependencies;
            delete pkg.scripts;
            pkg.bin = { nonlocalhost: 'dist/index.js' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish
        working-directory: apps/cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
